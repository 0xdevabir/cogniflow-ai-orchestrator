version: "3.9"

# CogniFlow — local dev infra.
# Brings up Postgres+pgvector, Redis, and Qdrant. The web/orchestrator/ml-gateway
# run on the host (or in their own dev containers in CI).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cogniflow-postgres
    environment:
      POSTGRES_USER: cogniflow
      POSTGRES_PASSWORD: cogniflow
      POSTGRES_DB: cogniflow
    ports:
      - "5432:5432"
    volumes:
      - cogniflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogniflow -d cogniflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cogniflow-redis
    ports:
      - "6379:6379"
    volumes:
      - cogniflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: cogniflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - cogniflow-qdrant:/qdrant/storage

  # Optional: Temporal + Postgres for the prod-grade DAG executor (Phase 8).
  # Uncomment when you want the workflow UI on http://localhost:8088
  # temporal:
  #   image: temporalio/auto-setup:1.24
  #   container_name: cogniflow-temporal
  #   ports:
  #     - "7233:7233"
  #     - "8088:8088"
  #   environment:
  #     - DB=postgresql
  #     - DB_PORT=5432
  #     - POSTGRES_USER=cogniflow
  #     - POSTGRES_PWD=cogniflow

volumes:
  cogniflow-pg:
  cogniflow-redis:
  cogniflow-qdrant: