name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: orchestrator (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/orchestrator/go.sum
      - working-directory: apps/orchestrator
        run: |
          go mod download
          go vet ./...
          go build ./...
          go test ./...

  py:
    name: ml-gateway (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/ml-gateway
        run: |
          uv sync --all-extras
          uv run ruff check .
          uv run pytest -q

  web:
    name: web (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test --silent