apiVersion: v1
kind: Service
metadata:
  name: {{ include "cogniflow.fullname" . }}-orchestrator
  labels:
    {{- include "cogniflow.orchestrator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.orchestrator.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cogniflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
